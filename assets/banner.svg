<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0ea5e9"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#6366f1"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#e0f2fe"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient><linearGradient id="badgeGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".7" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(20px,-15px);opacity:.6}}@keyframes floatCard1{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes floatCard2{0%{transform:translateY(0)}50%{transform:translateY(-14px)}}@keyframes floatCard3{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes flowLine{0%{stroke-dashoffset:400}}.orb-purple{transform-origin:200px 100px;animation:pulseOrb 8s ease-in-out infinite alternate}.orb-cyan{transform-origin:1000px 240px;animation:pulseOrb 7s ease-in-out infinite alternate}.card-1{animation:floatCard1 4.5s ease-in-out infinite}.card-2{animation:floatCard2 5.5s ease-in-out infinite}.card-3{animation:floatCard3 6s ease-in-out infinite}.flow-stream{stroke-dasharray:20 10;animation:flowLine 15s linear infinite}.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.sub-text{font-weight:400}.code-pill{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11px;font-weight:600}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><circle cx="180" cy="90" r="140" fill="#6366f1" class="orb-purple" filter="url(#glow)" opacity=".3"/><circle cx="1020" cy="220" r="160" fill="#0ea5e9" class="orb-cyan" filter="url(#glow)" opacity=".25"/><circle cx="620" cy="300" r="120" fill="#8b5cf6" filter="url(#glow)" opacity=".15"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M -50,280 Q 200,160 450,260 T 950,220 T 1250,260" class="flow-stream" opacity=".2"/><path fill="none" stroke="#a855f7" stroke-width="1" d="M -50,310 Q 250,220 550,300 T 1050,250 T 1250,300" class="flow-stream" opacity=".25"/><g class="card-1" transform="translate(860, 45)"><rect width="280" height="74" fill="#0f172a" fill-opacity=".8" stroke="#334155" stroke-width="1.2" rx="12"/><circle cx="36" cy="37" r="18" fill="#1e293b"/><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M 27 28 H 31 L 34 42 H 45 L 48 31 H 33"/><circle cx="36" cy="46" r="1.8" fill="#38bdf8"/><circle cx="43" cy="46" r="1.8" fill="#38bdf8"/><text x="66" y="32" fill="#94a3b8" class="sub-text" font-size="12">GLOBAL COMMERCE</text><text x="66" y="52" fill="#f8fafc" class="title-text" font-size="16">$6.8 Trillion+ Market</text></g><g class="card-2" transform="translate(890, 138)"><rect width="260" height="74" fill="#0f172a" fill-opacity=".85" stroke="#38bdf8" stroke-o