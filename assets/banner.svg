<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }
    @keyframes floatCard3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes spinWheel {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .orb-purple {
      transform-origin: 200px 100px;
      animation: pulseOrb 8s ease-in-out infinite alternate;
    }
    .orb-cyan {
      transform-origin: 1000px 240px;
      animation: pulseOrb 7s ease-in-out infinite alternate;
    }
    .card-1 {
      animation: floatCard1 4.5s ease-in-out infinite;
    }
    .card-2 {
      animation: floatCard2 5.5s ease-in-out infinite;
    }
    .card-3 {
      animation: floatCard3 6s ease-in-out infinite;
    }
    .flow-stream {
      stroke-dasharray: 20 10;
      animation: flowLine 15s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
    .code-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambient Orbs (Background layer) -->
  <circle class="orb-purple" cx="180" cy="90" r="140" fill="#6366f1" filter="url(#glow)" opacity="0.3" />
  <circle class="orb-cyan" cx="1020" cy="220" r="160" fill="#0ea5e9" filter="url(#glow)" opacity="0.25" />
  <circle cx="620" cy="300" r="120" fill="#8b5cf6" filter="url(#glow)" opacity="0.15" />

  <!-- Subtle Blueprint Tech Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Decorative Flow Wave Vector in Background -->
  <path class="flow-stream" d="M -50,280 Q 200,160 450,260 T 950,220 T 1250,260" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" />
  <path class="flow-stream" d="M -50,310 Q 250,220 550,300 T 1050,250 T 1250,300" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.25" />

  <!-- Dynamic Glassmorphic Floating Metric Cards (Framing Right Side, keeping center-left clear for main text) -->
  <g class="card-1" transform="translate(860, 45)">
    <rect width="280" height="74" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
    <circle cx="36" cy="37" r="18" fill="#1e293b" />
    <!-- Cart Icon -->
    <path d="M 27 28 H 31 L 34 42 H 45 L 48 31 H 33" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="36" cy="46" r="1.8" fill="#38bdf8" />
    <circle cx="43" cy="46" r="1.8" fill="#38bdf8" />
    <text x="66" y="32" class="sub-text" fill="#94a3b8" font-size="12">GLOBAL COMMERCE</text>
    <text x="66" y="52" class="title-text" fill="#f8fafc" font-size="16">$6.8 Trillion+ Market</text>
  </g>

  <g class="card-2" transform="translate(890, 138)">
    <rect width="260" height="74" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="36" cy="37" r="18" fill="#1e293b" />
    <!-- Terminal / Headless Icon -->
    <path d="M 28 32 L 34 37 L 28 42 M 37 42 H 44" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="66" y="32" class="sub-text" fill="#94a3b8" font-size="12">ARCHITECTURES</text>
    <text x="66" y="52" class="title-text" fill="#f8fafc" font-size="15">SaaS &#8226; Headless &#8226; OSS</text>
  </g>

  <g class="card-3" transform="translate(840, 230)">
    <rect width="290" height="74" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
    <circle cx="36" cy="37" r="18" fill="#1e293b" />
    <!-- Star Icon -->
    <polygon points="36,27 39,33 46,34 41,39 42,46 36,42 30,46 31,39 26,34 33,33" fill="#eab308" />
    <text x="66" y="32" class="sub-text" fill="#94a3b8" font-size="12">COMMUNITY POWERED</text>
    <text x="66" y="52" class="title-text" fill="#f8fafc" font-size="15">15+ Verified Solutions</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Permanently in front, crisp, and high-contrast) -->
  <g transform="translate(70, 0)">
    <!-- Top Category Pill / Badge -->
    <g transform="translate(0, 52)">
      <rect width="248" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="16" cy="14" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" class="code-pill" fill="#38bdf8" letter-spacing="0.8">CURATED STOREFRONTS &amp; CARTS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title-text" fill="url(#textGrad)" font-size="40">Awesome Online Storefront</text>
    <text x="0" y="180" class="title-text" fill="#ffffff" font-size="38">&amp; Shopping Cart</text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="222" class="sub-text" fill="#94a3b8" font-size="15.5">
      The ultimate guide to e-commerce engines, hosted storefronts, and self-hosted open-source shopping carts.
    </text>
    <text x="0" y="246" class="sub-text" fill="#64748b" font-size="14">
      Compare real SaaS starting pricing, free tier limits, company valuation, and GitHub developer stars.
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 276)">
      <!-- Tag 1 -->
      <rect width="112" height="26" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="56" y="17" class="code-pill" fill="#93c5fd" text-anchor="middle">Shopify</text>

      <!-- Tag 2 -->
      <rect x="122" width="112" height="26" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="178" y="17" class="code-pill" fill="#93c5fd" text-anchor="middle">MedusaJS</text>

      <!-- Tag 3 -->
      <rect x="244" width="124" height="26" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="306" y="17" class="code-pill" fill="#93c5fd" text-anchor="middle">WooCommerce</text>

      <!-- Tag 4 -->
      <rect x="378" width="108" height="26" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="432" y="17" class="code-pill" fill="#93c5fd" text-anchor="middle">Saleor</text>

      <!-- Tag 5 -->
      <rect x="496" width="112" height="26" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="552" y="17" class="code-pill" fill="#93c5fd" text-anchor="middle">Bagisto</text>

      <!-- Tag 6 -->
      <rect x="618" width="122" height="26" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="679" y="17" class="code-pill" fill="#a7f3d0" text-anchor="middle">Headless / API</text>
    </g>
  </g>

  <!-- Crisp Modern Outer Border -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.7"/>
</svg>